[project]
name = "fittrack-backend"
version = "0.1.0"
description = "Fitness Tracker API - Powerlifting & Cycling"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0.0",
    "cryptography>=43.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "fitparse>=1.2.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",     # FastAPI Depends()/Query() in default args — standard pattern
    "F821",     # Forward refs in SQLAlchemy models (string-based relationships)
    "BLE001",   # Blind except — acceptable in service/integration code
    "DTZ011",   # date.today() — fine in business logic
    "DTZ001",   # datetime() without tzinfo — mostly in tests
    "DTZ003",   # datetime.utcnow() — migration pending
    "DTZ007",   # datetime.strptime() without zone
    "DTZ901",   # datetime.min/max without tzinfo
    "F401",     # Unused imports — barrel re-exports in __init__.py
    "F841",     # Unused variables — placeholders / planned future use
    "FURB162",  # fromisoformat replace("Z","+00:00") — Python 3.10 compat
    "G201",     # logging.exception() — already provides exc_info
    "PLW1510",  # subprocess.run without check — intentional
    "PYI063",   # PEP 570 positional-only — Pydantic compat
    "RUF034",   # Useless if-else — style preference
    "RUF046",   # Unnecessary cast to int — defensive coding
    "RUF059",   # Unused unpacked variable
    "S110",     # try-except-pass — intentional in many places
    "SIM102",   # Collapsible if — readability preference
    "UP031",    # printf-style formatting — existing code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001", "DTZ011", "DTZ007"]
