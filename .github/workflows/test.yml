name: CI

on:
  push:
    branches: [main, prod]
    # Docs-only pushes skip CI, so they also skip the Deploy that CI gates.
    # A documentation fix otherwise costs a full image rebuild and a Droplet
    # redeploy to ship nothing the server serves. `paths-ignore` skips a run
    # only when *every* changed file matches, so any commit touching code,
    # config or `.github/` still runs the full suite. Deliberately not added
    # to `pull_request` below — the PR gate stays exhaustive.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
  pull_request:
    branches: [main, prod]
  # Manual retry lever (Pitfall #27): a prod push that registers no CI run
  # cannot be retried cleanly — dispatch CI on prod instead of a no-op commit.
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dependencies
        working-directory: backend
        run: pip install ruff

      - name: Run ruff
        working-directory: backend
        run: ruff check .

      - name: Validate agent map and CODEMAP anchors
        run: python scripts/check_agent_map.py

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack_test
          POSTGRES_DB: fittrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fittrack"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fittrack:fittrack_test@localhost:5432/fittrack_test
      DATABASE_URL: postgresql+asyncpg://fittrack:fittrack_test@localhost:5432/fittrack_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v

      - name: Verify migration chain on a fresh database
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          # The chain contains intentional irreversible historical migrations.
          # Round-trip the newest migration instead of pretending every old
          # downgrade is supported.
          alembic downgrade 101
          alembic upgrade head
          alembic current

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Audit vulnerabilities (non-blocking)
        working-directory: frontend
        run: npm audit || true

      - name: Build
        working-directory: frontend
        run: npm run build

  api-contract:
    name: Validate API contract generation
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://fittrack:fittrack_test@localhost:5432/fittrack_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit

      - name: Export OpenAPI schema
        working-directory: backend
        run: python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi-ci.json', 'w'), separators=(',', ':'))"

      - name: Generate TypeScript contract
        # Use the project's pinned openapi-typescript from node_modules, not npx
        # (latest), so the output is deterministic and matches generated.ts.
        run: frontend/node_modules/.bin/openapi-typescript backend/openapi-ci.json -o frontend/src/lib/api/types/generated.ci.ts

      - name: Require generated types to be current
        run: |
          test -s frontend/src/lib/api/types/generated.ci.ts
          diff -u frontend/src/lib/api/types/generated.ts frontend/src/lib/api/types/generated.ci.ts

  test-e2e:
    name: Test E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright specs (mocked API — no backend needed)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000/fittrack
        # Scoped to the verified-green specs (B-34). The remaining spec files
        # have pre-existing mock drift and run locally via `npm run test:e2e`
        # until the full-suite rehab lands.
        run: npm run test:e2e:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
