# CD — Deploy to DigitalOcean on push to main (after CI passes)
#
# Required GitHub repository secrets:
#   DROPLET_HOST    — Droplet IP or hostname
#   DROPLET_USER    — SSH user (usually "root")
#   DROPLET_SSH_KEY — Private SSH key for the Droplet
#
# The .env file must already exist on the Droplet (created during initial setup).
# Migrations run automatically on app startup (see backend/app/main.py lifespan).
#
# This workflow builds and pushes images to GHCR, then pulls them on the server.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [prod]
  # Manual trigger (Pitfall #27): a manual dispatch is a safe no-op under the
  # `if: workflow_run.conclusion == 'success'` guards below — the supported
  # retry path is dispatching CI on prod, whose completion fires this workflow.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/oliradlett/fitnesstracker/backend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/oliradlett/fitnesstracker/frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          no-cache: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Extract metadata for worker/beat (same as backend)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/oliradlett/fitnesstracker/worker
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push worker (same image as backend)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 20m
          envs: REGISTRY,GITHUB_SHA
          script: |
            export REGISTRY="${{ env.REGISTRY }}"
            export GITHUB_SHA="${{ github.sha }}"
            set -euo pipefail

            cd /opt/fitness-tracker

            echo "▸ Pulling latest code…"
            git fetch origin prod
            git reset --hard origin/prod

            echo "▸ Deriving production Caddyfile from infra/Caddyfile…"
            # infra/Caddyfile is the single source of truth (routing + security
            # headers). Derive the deployed file from it instead of duplicating
            # the body here: a hand-maintained inline copy previously drifted and
            # shipped without the security headers. Only two values are
            # substituted -- the site address, and the ACME account email which
            # comes from a repo secret rather than the droplet .env.
            DEPLOY_DOMAIN=$(grep -E '^DOMAIN=' .env 2>/dev/null | cut -d= -f2- || echo "localhost")
            ACME_EMAIL="${{ secrets.ACME_EMAIL || 'admin@example.com' }}"
            sed -e "s|{\$DOMAIN:localhost}|${DEPLOY_DOMAIN}|" \
                -e "s|^\([[:space:]]*\)email .*|\1email ${ACME_EMAIL}|" \
                infra/Caddyfile > infra/Caddyfile.tmp
            mv infra/Caddyfile.tmp infra/Caddyfile
            echo "▸ Caddyfile validated:"
            cat infra/Caddyfile

            echo "▸ Logging in to GHCR…"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "▸ Pulling pre-built images…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "▸ Verifying frontend image contains server.js…"
            docker run --rm --entrypoint sh ghcr.io/oliradlett/fitnesstracker/frontend:latest -c "test -f /app/server.js && echo OK: server.js present"

            echo "▸ Stopping services…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --timeout 30

            echo "▸ Starting services…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "▸ Running database migrations…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend alembic upgrade head

            echo "▸ Cleaning up old images…"
            docker image prune -f

            echo "▸ Waiting for backend health check…"
            # Read domain from .env so Caddy routes to the correct site block.
            # Uses -k for self-signed/local certs, -L to follow HTTPS redirect.
            DEPLOY_DOMAIN=$(grep -E '^DOMAIN=' .env 2>/dev/null | cut -d= -f2- || echo "localhost")
            for i in $(seq 1 60); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -k -L -H "Host: ${DEPLOY_DOMAIN}" "https://localhost/health" || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "  ✓ Backend healthy after ${i}s"
                break
              fi
              sleep 2
            done

            echo "▸ Deploy complete ✓"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to DigitalOcean failed. Check the SSH action logs above."
