# CD — Deploy to DigitalOcean on push to main (after CI passes)
#
# Required GitHub repository secrets:
#   DROPLET_HOST    — Droplet IP or hostname
#   DROPLET_USER    — SSH user (usually "root")
#   DROPLET_SSH_KEY — Private SSH key for the Droplet
#
# The .env file must already exist on the Droplet (created during initial setup).
# Migrations run automatically on app startup (see backend/app/main.py lifespan).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 20m
          script: |
            set -euo pipefail

            cd /opt/fitness-tracker

            echo "▸ Pulling latest code…"
            git fetch origin main
            git reset --hard origin/main

            echo "▸ Generating production Caddyfile (without tls internal)…"
            DEPLOY_DOMAIN=$(grep -E '^DOMAIN=' .env 2>/dev/null | cut -d= -f2- || echo "localhost")
            cat > infra/Caddyfile <<CADDYEOF
            {
                email admin@example.com
            }

            :80 {
                redir https://{host}{uri} permanent
            }

            ${DEPLOY_DOMAIN} {
                handle /fittrack/* {
                    reverse_proxy frontend:3000
                }
                handle /api/v1/* {
                    reverse_proxy backend:8000
                }
                handle /health {
                    reverse_proxy backend:8000
                }
                handle / {
                    redir /fittrack permanent
                }
            }
            CADDYEOF

            echo "▸ Stopping services…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --timeout 30

            echo "▸ Clearing Docker build cache…"
            docker builder prune -a -f

            echo "▸ Building images (no cache)…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache

            echo "▸ Starting services…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "▸ Cleaning up old images…"
            docker image prune -f

            echo "▸ Waiting for backend health check…"
            # Read domain from .env so Caddy routes to the correct site block.
            # Uses -k for self-signed/local certs, -L to follow HTTPS redirect.
            DEPLOY_DOMAIN=$(grep -E '^DOMAIN=' .env 2>/dev/null | cut -d= -f2- || echo "localhost")
            for i in $(seq 1 60); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -k -L -H "Host: ${DEPLOY_DOMAIN}" "https://localhost/health" || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "  ✓ Backend healthy after ${i}s"
                break
              fi
              sleep 2
            done

            echo "▸ Deploy complete ✓"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to DigitalOcean failed. Check the SSH action logs above."
